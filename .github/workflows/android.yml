name: Android CI Auto Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24333f8a6351dd797dd779d14a791a4123dd11ad" > "$ANDROID_HOME/licenses/android-sdk-license" || true
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
        echo "859f31569af34f261c472913961766a50ab180b4" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Restore Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Restored debug.keystore from base64"
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "Generated fallback debug.keystore"
        fi

    - name: Prepare Environment Secrets
      run: |
        if [ ! -f .env ]; then
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
        fi

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon || true

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Verify Generated APK
      run: |
        echo "=== Generated APK Files ==="
        ls -lh app/build/outputs/apk/debug/

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyProxy-Auto-Build-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: error
